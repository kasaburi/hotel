<!DOCTYPE html>
<html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Hotel</title>
        <link rel="stylesheet" href="./singin.css">
        <link rel ="icon" href="./image/logo-ai.png">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.6.1/dist/nouislider.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    </head>
    <body>
        <header>
            <nav class="navbar">
                <div class="hotel">
                    <div class="star">
                        <i class="fa-regular fa-star fa-xl"  style="color: #ffffff;"></i>
                    </div>
                    <p>Star Hotell</p>
                </div>
                <img src="./image/logo-ai.png" alt="icon" class="icon">
                <div class="hamburger">
                    <i class="fa-solid fa-bars fa-lg"  style="color:rgb(3, 101, 176)" id="hamburger"></i>
                </div>
                <ul class="nav-links" id="navLinks">
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="./rooms.html">Rooms</a></li>
                    <li><a href="./hotel.html">Hotels</a></li>
                    <li><a href="./bookedrooms.html">Booked Rooms</a></li>
                </ul>
                <div class="log">
                    <button type="button" id="btnLoginRegister">
                        Login
                        <img src="./image/login.svg" class="login">
                    </button>
                </div>
                <div id="authPopup" class="auth-popup">
                    <div class="auth-popup-content">
                        <button type="button" id="btnClose" class="auth-close">❌</button>
                        <div id="authContent"></div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <div class="img">
                <img src="./image/hotel.jpg" alt="icon" class="image">
            </div>
            <form id="loginForm">
                <h2>Authorization</h2>
                <label for="email">email</label>
                <input type="email" id="email" name="email" required placeholder="email">
                <label for="password">password</label>
                <input type="password" id="password" name="password" required minlength="6" placeholder="password">
                <button type="submit" id="submit">Login</button>
                <div id="loginError" style="color:red; display:none;"></div>
                <div id="loginSuccess" style="color:green; display:none;"></div>
                <a href="./registre.html"  class="reg">completing registration</a>
            </form>
        </main>
        <footer>
            <div class="content1">
                <p>© 2023 IT Academy Step All; Rights Reserved</p>
                <div class="content3">
                    <div class="content2">
                       <a href="#section"><i class="fa-solid fa-arrow-up fa-sm" style="color:aqua"  id="arrow"></i></a>
                    </div>
                </div>
            </div>
        </footer>
        <script src="singin.js"></script>
    </body>
</html>
