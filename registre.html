<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow"/>
    <meta name="description" content="Hotel,Room Hotel"/>
    <meta name="author" content="natia kasaburi"/>
    <meta name="keywords" content="delicious,Outstanding,Hotel"/>
    <meta property="og:title" content="Hotel"/>
    <meta property="og:description" content="ice cream"/>
    <meta property="og:type" content="website"/>
    <title>Hotel</title>
    <link rel="stylesheet" href="./registre.css">
    <link rel="icon" href="./image/logo-ai.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.6.1/dist/nouislider.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
    <body>
        <header>
            <nav class="navbar">
                <div class="hotel">
                    <div class="star">
                        <i class="fa-regular fa-star fa-xl" style="color: #ffffff;"></i>
                    </div>
                    <p>Star Hotell</p>
                </div>
                <img src="./image/logo-ai.png" alt="icon" class="icon">
                <div class="hamburger">
                    <i class="fa-solid fa-bars fa-lg" style="color:rgb(3, 101, 176)" id="hamburger"></i>
                </div>
                <ul class="nav-links" id="navLinks">
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="./rooms.html">Rooms</a></li>
                    <li><a href="./hotel.html">Hotels</a></li>
                    <li><a href="./bookedrooms.html">Booked Rooms</a></li>
                </ul>
                <div class="log">
                    <button type="button" id="btnLoginRegister">
                        Login
                        <img src="./image/login.svg" class="login">
                    </button>
                </div>
                <div id="authPopup" class="auth-popup">
                    <div class="auth-popup-content">
                        <button type="button" id="btnClose" class="auth-close">❌</button>
                        <div id="authContent"></div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <div class="img">
                <img src="./image/hotel.jpg" alt="icon" class="image">
            </div>
            <div class="box">
                <h2>Registration</h2>
                <form id="signupForm" novalidate>
                    <div class="row">
                        <div class="field">
                            <label for="firstName">firstName *</label>
                            <input id="firstName" class="firstName" name="firstName" type="text" placeholder="name" required />
                        </div>
                        <div class="field">
                            <label for="lastName">lastname *</label>
                            <input id="lastName" class="lastName" name="lastName" type="text" placeholder="lastName" required />
                        </div>
                    </div>
                    <div class="row1">
                        <div class="field2"  id="field2">
                            <label for="age">age *</label>
                            <input id="age" name="age" class="age" type="number" min="1" max="120" placeholder="age" required />
                        </div>
                        <div class="field2">
                            <label for="gender">gender *</label>
                            <select id="gender" name="gender" required>
                                <option value="" class="other">Choose…</option>
                                <option value="MALE" class="other">MALE</option>
                                <option value="FEMALE" class="other">FEMALE</option>
                                <option value="OTHER" class="other">OTHER</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="field1">
                            <label for="email">Email *</label>
                            <input id="email" name="email" type="email" placeholder="@mail.com" required />
                        </div>
                        <div class="field1">
                            <label for="password">password</label>
                            <input type="password" id="password" name="password" required minlength="6">
                            <div class="showPassword">
                                <input type="checkbox" id="showPassword">
                                <label for="showPassword">showPassword</label>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label for="address">Address *</label>
                            <input id="address" name="address" type="text" placeholder="address" required />
                        </div>
                        <div class="field">
                            <label for="phone">phone</label>
                            <input
                                id="phone"
                                name="phone"
                                type="tel"
                                placeholder="+995599123456"
                                pattern="^\+995\d{9}$"
                                required />
                        </div>
                    </div>
                    <div class="actions">
                        <button type="submit" class="primary">Registration</button>
                        <button type="reset" class="reset">cancel</button>
                    </div>
                    <a href="./singin.html" class="reg">Completing authorization</a>
                </form>
                <div id="formError"></div>
                <div id="formSuccess"></div>
            </div>
        </main>
        <footer>
            <div class="content1">
                <p>© 2023 IT Academy Step All; Rights Reserved</p>
                <div class="content3">
                    <div class="content2">
                    <a href="#section"><i class="fa-solid fa-arrow-up fa-sm" style="color:aqua" id="arrow"></i></a>
                    </div>
                </div>
            </div>
        </footer>
    <script src="./registre.js"></script>
    </body>
</html>
